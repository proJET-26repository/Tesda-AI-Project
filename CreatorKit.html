<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorKit - Content Creator Dashboard & Prompt Generator Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#0A2463', brightBlue: '#3E92CC', pinkRed: '#D8315B', darkText: '#1E1B18', lightBg: '#F8FAFC' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-lightBg text-darkText min-h-screen flex flex-col antialiased">

    <!-- Universal Ecosystem Top Bar -->
    <header class="bg-navy text-white px-4 py-3 border-b border-blue-900 flex items-center justify-between shadow-md sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-pinkRed text-white p-2 rounded-xl flex items-center justify-center font-bold text-base w-9 h-9">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <span class="font-bold text-lg tracking-wide">CreatorKit</span>
                <span class="text-[10px] text-brightBlue block uppercase tracking-widest font-semibold">Prompt Generator Hub</span>
            </div>
        </div>
        <nav class="hidden md:flex items-center space-x-3 text-xs font-semibold text-slate-200">
            <a href="index.html" class="hover:text-brightBlue transition-colors">Landing Hub</a>
            <span class="text-slate-600">|</span>
            <a href="contol_estate.html" class="hover:text-brightBlue transition-colors">Control Estate</a>
            <span class="text-slate-600">|</span>
            <a href="alt_dining.html" class="hover:text-brightBlue transition-colors">Alt Dinning</a>
            <span class="text-slate-600">|</span>
            <a href="elite_gaming_hub.html" class="hover:text-brightBlue transition-colors">Elite Gaming Hub</a>
            <span class="text-slate-600">|</span>
            <a href="CreatorKit.html" class="text-pink-400 font-bold">CreatorKit</a>
        </nav>
    </header>

    <!-- Main Content Layout -->
    <div class="flex-1 flex flex-col md:flex-row relative">
        <aside id="sidebar" class="bg-navy text-white w-64 md:w-72 flex-shrink-0 flex flex-col sticky top-[61px] h-[calc(100vh-61px)] z-40 shadow-xl">
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="#dashboard" onclick="switchTab('dashboard')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition-colors bg-brightBlue/20 text-white border-l-4 border-pinkRed">
                    <i class="fa-solid fa-chart-pie w-5 text-brightBlue"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#prompt-generator" onclick="switchTab('prompt-generator')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition-colors text-slate-300 hover:bg-white/10 hover:text-white">
                    <i class="fa-solid fa-terminal w-5 text-brightBlue"></i>
                    <span>Prompt Generator</span>
                </a>
                <a href="#saved-vault" onclick="switchTab('saved-vault')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition-colors text-slate-300 hover:bg-white/10 hover:text-white">
                    <i class="fa-solid fa-bookmark w-5 text-brightBlue"></i>
                    <span>Saved Vault</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 p-8">
            <div id="tab-dashboard" class="tab-content space-y-6">
                <h2 class="text-2xl font-bold text-navy">CreatorKit Prompt Dashboard</h2>
                <p class="text-slate-600 text-sm">Welcome to the prompt engineering dashboard demo.</p>
            </div>
            <div id="tab-prompt-generator" class="tab-content hidden space-y-4">
                <h3 class="text-xl font-bold text-navy">AI Prompt Generator</h3>
                <textarea class="w-full p-4 border rounded-xl" placeholder="Generated prompt text output..."></textarea>
            </div>
        </main>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
